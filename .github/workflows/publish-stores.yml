name: Publish stores

# Operator machine (release.py): GitHub Release, then Wings, then this job.
# Uploads client zip + server-mods zip to CurseForge and mrpack + server-mods
# zip to Modrinth. Default channel is alpha (GitHub prerelease). Do not put
# Minecraft or loader version literals in this file.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v0.0.4)
        required: true
        type: string
      channel:
        description: Store channel
        type: choice
        options:
          - alpha
          - beta
          - release
        default: alpha
      skip_curseforge:
        description: Skip CurseForge (retry after a successful CurseForge upload)
        type: boolean
        default: false
      skip_modrinth:
        description: Skip Modrinth (retry after a successful Modrinth upload)
        type: boolean
        default: false

run-name: Publish stores ${{ inputs.tag }} ${{ inputs.channel }}

concurrency:
  group: publish-stores-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve tag
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          TAG="${TAG#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing stores for $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Use tagged pack.toml and changelog
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          git checkout "$TAG" -- pack/pack.toml CHANGELOG.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read pack.toml
        id: pack
        run: python scripts/read_pack_versions.py --github-output

      - name: Assert tag matches pack version
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          PACK_VERSION: ${{ steps.pack.outputs.pack_version }}
        run: |
          set -euo pipefail
          EXPECTED="v${PACK_VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match pack.toml version $PACK_VERSION (expected $EXPECTED)"
            exit 1
          fi

      - name: Wait for GitHub Release assets
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p artifacts
          for i in $(seq 1 40); do
            if gh release download "$TAG" --dir artifacts --pattern "*.mrpack" --pattern "*.zip"; then
              clients=(artifacts/*.zip)
              servers=(artifacts/*-server-mods.zip)
              mrpacks=(artifacts/*.mrpack)
              client_count=0
              for zip in "${clients[@]}"; do
                case "$zip" in
                  *-server-mods.zip) ;;
                  *) client_count=$((client_count + 1)) ;;
                esac
              done
              if [ "$client_count" -eq 1 ] && [ ${#servers[@]} -eq 1 ] && [ ${#mrpacks[@]} -eq 1 ]; then
                echo "client and server artifacts ready"
                exit 0
              fi
            fi
            echo "GitHub Release assets not ready yet (attempt $i)"
            rm -rf artifacts
            mkdir -p artifacts
            sleep 15
          done
          echo "Timed out waiting for GitHub Release client zip, server-mods zip, and mrpack on $TAG"
          exit 1

      - name: Write store notes from CHANGELOG.md
        run: python scripts/write_store_notes.py --output notes.md

      - name: Upload client and server packs
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ inputs.skip_curseforge }}" = "true" ]; then
            extra+=(--skip-curseforge)
          fi
          if [ "${{ inputs.skip_modrinth }}" = "true" ]; then
            extra+=(--skip-modrinth)
          fi
          python scripts/publish_store_files.py \
            --artifacts artifacts \
            --channel "${{ inputs.channel }}" \
            --notes notes.md \
            "${extra[@]}"
