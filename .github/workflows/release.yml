name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read pack.toml
        id: pack
        run: python scripts/read_pack_versions.py --github-output

      - name: Assert tag matches pack version
        env:
          PACK_VERSION: ${{ steps.pack.outputs.pack_version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${PACK_VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match pack.toml version $PACK_VERSION (expected $EXPECTED)"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Refresh and export
        working-directory: pack
        run: |
          packwiz refresh
          packwiz curseforge export
          packwiz modrinth export
          ls -la *.zip *.mrpack

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pack/*.zip
            pack/*.mrpack
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check publishing credentials
        id: publish
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          if [ -n "$CURSEFORGE_TOKEN" ] && [ -n "$CURSEFORGE_PROJECT_ID" ]; then
            echo "curseforge=true" >> "$GITHUB_OUTPUT"
          else
            echo "curseforge=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$MODRINTH_TOKEN" ] && [ -n "$MODRINTH_PROJECT_ID" ]; then
            echo "modrinth=true" >> "$GITHUB_OUTPUT"
          else
            echo "modrinth=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip CurseForge if secrets missing
        if: ${{ steps.publish.outputs.curseforge != 'true' }}
        run: 'echo "CurseForge upload skipped: CURSEFORGE_TOKEN or CURSEFORGE_PROJECT_ID not set"'

      - name: Upload to CurseForge
        if: ${{ steps.publish.outputs.curseforge == 'true' }}
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: pack/*.zip
          loaders: ${{ steps.pack.outputs.loader }}
          game-versions: ${{ steps.pack.outputs.minecraft }}
          version: ${{ steps.pack.outputs.pack_version }}
          version-type: alpha

      - name: Skip Modrinth if secrets missing
        if: ${{ steps.publish.outputs.modrinth != 'true' }}
        run: 'echo "Modrinth upload skipped: MODRINTH_TOKEN or MODRINTH_PROJECT_ID not set"'

      - name: Upload to Modrinth
        if: ${{ steps.publish.outputs.modrinth == 'true' }}
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: pack/*.mrpack
          loaders: ${{ steps.pack.outputs.loader }}
          game-versions: ${{ steps.pack.outputs.minecraft }}
          version: ${{ steps.pack.outputs.pack_version }}
          version-type: alpha
