# Pack: largest TerraBlender regions so RU / BWG / vanilla-Terralith slices are not postage stamps.
# Size 6 is the maximum. Do not lower it — that shrinks regions and mixes biome mods more often.

[generation_settings]
overworld_region_size = 6
nether_region_size = 6
vanilla_overworld_region_weight = 10
vanilla_nether_region_weight = 10
