# Iris Shaders — Lead and Leylines
#
# Iris 1.8.14-beta.1 (pinned in pack/mods/irisshaders.pw.toml). Iris moved most
# of its settings into Sodium's own config in this version, so this file is now
# only the seven legacy keys below. Shadow distance and colour space are edited
# in the Sodium/Iris video settings screen, not here.
#
# This file exists to pin state and document intent, not to change it: every key
# below is the value Iris writes on a first boot. Without it, each player's
# instance silently gets whatever Iris happens to write, unreviewed.
#
# Deliberately NOT set here:
#
#   enableShaders=false is left as Iris's default, so the pack does not force
#   shaders on. The pack ships Complementary, BSL, Euphoria, and Colorwheel, but
#   turning shaders on is a player's choice and a large performance cost on
#   weaker GPUs. ATM-10 sets enableShaders=true; that is a pack policy decision,
#   not a correctness one, and it is not copied here.
#
#   shaderPack is left empty so Iris does not pin one pack on every player. The
#   pack ships several and lets people choose.
#
#   maxShadowRenderDistance is pinned at Iris's default of 32. Do not raise it to
#   chase a screenshot: this pack pairs Iris with Colorwheel, which has its own
#   irisflw constraints (see docs/mods/performance.md).
#
# allowUnknownShaders is false, unlike ATM-10's file which sets it true. Unknown
# shader packs are the ones most likely to misrender against Colorwheel.
allowUnknownShaders=false
colorSpace=SRGB
disableUpdateMessage=false
enableDebugOptions=false
enableShaders=false
maxShadowRenderDistance=32
shaderPack=
