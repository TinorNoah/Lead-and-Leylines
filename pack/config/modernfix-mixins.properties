# ModernFix mixin overrides — Lead and Leylines
#
# Every mixin not listed here stays at ModernFix's own default (modernfix
# 5.27.24, pinned in pack/mods/modernfix.pw.toml). This file deliberately sets
# exactly one key. Do not paste ModernFix's full commented option list here;
# a short file survives mod updates without churn.
#
# mixin.perf.dynamic_resources=true
#   Loads blockstates, models, and model textures on worker threads during
#   resource load instead of the main thread. Worth it for this pack: about 20
#   resource packs are force-enabled in pack/config/global_packs.toml
#   ([resourcepacks].required), and mods here ship a large volume of missing
#   asset references (see docs/mods/configs.md, known-client-asset-issues.md).
#   It cuts model baking off the critical path at load and reload.
#
#   Risk: non-default, and this pack's documented client failure mode is a
#   resource reload aborting (see docs/mods/configs.md, Global Packs row, where
#   a missing model aborts the reload and the recovery reload crashes AAA
#   Particles). Verified on a dedicated server boot only — the 13
#   perf.dynamic_resources mixins are in ModernFix's `client` mixin list, so
#   scripts/smoke_test.py does not exercise them. Client boot still unverified.
#
# stability_level is intentionally NOT raised to BETA. ATM-10 sets
# stability_level=BETA; do not copy that. It widens the blast radius of any
# unknown mixin interaction, and this pack already has one fragile client path.
mixin.perf.dynamic_resources=true
