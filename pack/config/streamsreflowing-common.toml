# Lead and Leylines — Streams Reflowing pack override.
# Cheap enough for live /rtp on Tectonic. New chunks only, after a restart.
# Do not set HIGH/EXTREME/MAX without Chunky pregen.

generateStreams = true
generateLakes = true
rebiomeStreams = 0
rebiomeLakes = 0

[performance]
	# POTATO ~4s/region on Tectonic vs LOW ~12s vs MEDIUM ~19s. Coarser rivers.
	terrainAccuracyLevel = "POTATO"
	qualityPreset = "POTATO"
	plateSize = -1

[appearance]
	# Fewer channels to route and carve (default wetness 1.0, growDensity 0.75).
	wetnessMultiplier = 0.75
	growDensity = 1.25
	# Skip extra generation passes (flora, bank skin, underwater plants, vanilla-river current).
	vegetation = 0
	allWaterFlora = 0
	allWaterBanks = 0
	bankFeatures = 0
	customBanks = false
	underwaterFlora = 0

[water]
	flowVanillaRivers = false
	fastChunkLoading = true
