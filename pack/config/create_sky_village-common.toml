[general]
	logConfigOnLoad = false
	debugLogging = false
	logBundledWorldgenSummary = false

[skyVillage]
	enableSkyVillage = true
	enableSkyVillageStructure = true
	enableHighwindVillageStructure = true
	useCompactSkyVillage = true
	# Range: 0.0 ~ 1.0
	skyVillageSpawnChance = 1.0
	# Range: 1 ~ 4096
	skyVillageSpacing = 80
	# Range: 0 ~ 4095
	skyVillageSeparation = 40
	# Sit above Tectonic peaks (vertical scale 0.80). Range: -256 ~ 256
	skyVillageHeightOffset = 64
	# Range: 1 ~ 64
	maxIslandSize = 16
	debugSkyVillageGeneration = false
